name: Deploy ABQ ADU site

on:
  push:
    branches:
      - version6aduwizard
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build public-only website
        env:
          BUILDER_APP_URL: ${{ vars.BUILDER_APP_URL }}
        run: node scripts/build-public-site.js

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public-dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
